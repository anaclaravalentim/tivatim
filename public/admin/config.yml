# Configuração do painel de edição (Decap CMS) do Catálogo Tivatim.
# Documentação completa: https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: anaclaravalentim/tivatim
  branch: main
  base_url: https://tivatim.vercel.app
  auth_endpoint: api/auth

# Traduz os textos fixos da interface (menus, botões, "No Entries" etc.)
# pro português — ver public/admin/index.html, que carrega o pacote de
# idiomas antes deste arquivo.
locale: 'pt'

# Fotos enviadas pelo painel vão para public/products/ e ficam acessíveis
# em /products/<arquivo> — funciona tanto em desenvolvimento quanto no site
# publicado, sem precisar de nenhuma etapa extra de build.
media_folder: public/products
public_folder: /products

collections:
  - name: products
    label: Produtos
    label_singular: Produto
    description: >-
      Cada produto do catálogo é um arquivo separado aqui. Editar um campo e
      salvar já cria um commit no GitHub — a Vercel publica a mudança
      automaticamente em alguns instantes.
    folder: src/data/products
    create: true
    delete: true
    extension: json
    format: json
    # Gerado a partir de marca + nome na criação (ex.: "Lenovo" + "ThinkPad
    # E14" -> lenovo-thinkpad-e14) — esse identificador NÃO tem mais um campo
    # editável no formulário (ver abaixo), então não tem como mudar sem
    # querer depois que o produto já existe.
    slug: '{{brand}}-{{name}}'
    identifier_field: name
    summary: '{{name}} — {{brand}} (id: {{slug}})'
    sortable_fields: [name, brand, category]
    fields:
      # Sem campo editável pra o identificador do produto: ele é gerado uma
      # única vez (na criação, a partir de marca + nome) e usado como nome
      # do arquivo — outras partes do catálogo (a página em que o produto
      # aparece) dependem dele pra encontrar o produto, então travamos essa
      # edição por segurança. Se precisar consultá-lo, ele aparece entre
      # parênteses no título de cada produto na lista.
      - { name: id, widget: hidden, required: false }
      - label: Marca
        name: brand
        widget: select
        options:
          - { label: Intelbras, value: intelbras }
          - { label: Hikvision, value: hikvision }
          - { label: TP-Link, value: tp-link }
          - { label: Aruba, value: aruba }
          - { label: Brother, value: brother }
          - { label: Epson, value: epson }
          - { label: Canon, value: canon }
          - { label: Zebra, value: zebra }
          - { label: Lenovo, value: lenovo }
          - { label: Dell, value: dell }
          - { label: Acer, value: acer }
          - { label: Kingston, value: kingston }
          - { label: Western Digital, value: wd }
          - { label: Patriot, value: patriot }
          - { label: Lexar, value: lexar }
          - { label: Honeywell, value: honeywell }
          - { label: AOC, value: aoc }
          - { label: LG, value: lg }
          - { label: Samsung, value: samsung }
          - { label: Motorola, value: motorola }
          - { label: Furukawa, value: furukawa }
      - label: Categoria
        name: category
        widget: select
        hint: >-
          Só muda o rótulo/agrupamento do produto — para ele aparecer numa
          página diferente do catálogo, é preciso também editar
          src/data/pages.js (fora deste painel).
        options:
          - { label: Computadores e Notebooks, value: computadores }
          - { label: Monitores e Displays, value: monitores }
          - { label: Armazenamento, value: armazenamento }
          - { label: Memória e Componentes, value: memoria }
          - { label: Redes e Conectividade, value: redes }
          - { label: Segurança Eletrônica, value: seguranca }
          - { label: Impressão e Digitalização, value: impressao }
          - { label: Impressão Térmica e Automação, value: automacao }
          - { label: Comunicação, value: comunicacao }
          - { label: Periféricos e Acessórios, value: perifericos }
          - { label: Infraestrutura e Conectividade, value: infraestrutura }
          - { label: Destaques do Portfólio, value: destaques }
      - { label: Nome do produto, name: name, widget: string }
      - { label: Modelo / detalhe, name: model, widget: string }
      - { label: Descrição, name: description, widget: text, required: false }
      - label: Especificações
        name: specs
        widget: list
        field: { label: Item, name: item, widget: string }
      - label: Foto do produto
        name: image
        widget: image
        required: false
        hint: 'Aparece na ficha do produto e na lista deste painel.'
      - label: 'Ícone de placeholder (se não houver foto)'
        name: icon
        widget: select
        default: notebook
        options:
          - notebook
          - monitor
          - ssd
          - external-drive
          - ram
          - memory-card
          - router
          - switch
          - access-point
          - cable
          - camera
          - dvr
          - printer
          - label-printer
          - scanner
          - radio
          - phone
          - mouse
          - dock
          - webcam
          - usb-adapter
          - fiber
          - rack
